<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>API Gateway Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f4; }
        h1 { color: #333; }
        h2 { color: #333; margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #4CAF50; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .anomaly { color: red; font-weight: bold; }
        .normal { color: green; }
        .summary { margin: 20px 0; padding: 15px; background: white; border-left: 5px solid #008CBA; font-size: 18px; }
    </style>
</head>
<body>

<h1>API Gateway Dashboard</h1>

<div class="summary">
    Total requests today: <strong th:text="${totalRequests}"></strong>
</div>

<h2>Successful Requests</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>URL</th>
        <th>Method</th>
        <th>Status</th>
        <th>Response Time (ms)</th>
        <th>Timestamp</th>
        <th>Client IP</th>
        <th>Anomaly</th>
        <th>Reason</th>
    </tr>
    <tr th:each="log : ${successfulLogs}">
        <td th:text="${log.id}"></td>
        <td th:text="${log.username}"></td>
        <td th:text="${log.targetUrl}"></td>
        <td th:text="${log.httpMethod}"></td>
        <td th:text="${log.responseStatus}"></td>
        <td th:text="${log.responseTimeMs}"></td>
        <td th:text="${log.timestamp}"></td>
        <td th:text="${log.clientIp}"></td>
        <td th:text="${log.isAnomaly}"
            th:class="${log.isAnomaly} ? 'anomaly' : 'normal'"></td>
        <td th:text="${log.anomalyReason}"></td>
    </tr>
</table>

<h2>Unsuccessful Requests</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>URL</th>
        <th>Method</th>
        <th>Status</th>
        <th>Response Time (ms)</th>
        <th>Timestamp</th>
        <th>Client IP</th>
        <th>Anomaly</th>
        <th>Reason</th>
    </tr>
    <tr th:each="log : ${unsuccessfulLogs}">
        <td th:text="${log.id}"></td>
        <td th:text="${log.username}"></td>
        <td th:text="${log.targetUrl}"></td>
        <td th:text="${log.httpMethod}"></td>
        <td th:text="${log.responseStatus}"></td>
        <td th:text="${log.responseTimeMs}"></td>
        <td th:text="${log.timestamp}"></td>
        <td th:text="${log.clientIp}"></td>
        <td th:text="${log.isAnomaly}"
            th:class="${log.isAnomaly} ? 'anomaly' : 'normal'"></td>
        <td th:text="${log.anomalyReason}"></td>
    </tr>
</table>

</body>
</html>
